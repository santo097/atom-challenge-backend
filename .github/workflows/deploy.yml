name: Deploy to Firebase

# Cuándo se dispara:
# - Automáticamente al push a main (deploy a producción)
# - Manualmente desde la pestaña "Actions" con el botón "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Paso previo: asegurar que todo está verde antes de desplegar.
  # Si lint/typecheck/build/tests unitarios fallan, NO desplegamos.
  # -------------------------------------------------------------
  pre-deploy-checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long-for-zod
      JWT_EXPIRES_IN: 1h
      FIREBASE_PROJECT_ID: demo-atom-challenge
      CORS_ORIGINS: http://localhost:4200
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # -------------------------------------------------------------
  # Deploy real a Firebase Cloud Functions + Firestore rules/indexes.
  # Solo corre si pre-deploy-checks pasó.
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Functions
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    # Ambiente de producción: permite tener secrets con protección extra
    # y ver el historial de deploys en la pestaña "Environments" del repo.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # Autenticación con Google Cloud usando el service account JSON
      # guardado en los secrets del repo como FIREBASE_SERVICE_ACCOUNT.
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deploy de las reglas e índices de Firestore.
      # Idempotente: si no hay cambios, no hace nada.
      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive

      # Deploy de la Cloud Function `api`.
      # El archivo .env.atom-challenge-88068 NO se versiona ni se sube
      # — los valores viven en el código via defineString() con defaults.
      # El JWT_SECRET vive en Secret Manager, ya configurado previamente.
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive
